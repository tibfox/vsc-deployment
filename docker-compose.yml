# review2 HIGH #9/#10/#11/#12/#56 — network segmentation + least-privilege.
#
# Topology (was: one flat bridge with every container reachable from every
# other):
#   - dbnet  : INTERNAL (no internet). Only go-vsc-node/init <-> mongo.
#   - btcnet : bridge (btcd needs BTC P2P egress). Only go-vsc-node <-> btcd,
#              pinned subnet so btcd RPC can be scoped to it.
#   - proxynet: INTERNAL. watchtower <-> docker-socket-proxy only.
# A compromise of one container can no longer pivot to mongo (no auth) or
# btcd RPC, and watchtower no longer mounts the raw docker socket.
services:
  init:
    profiles: ["init"]
    image: vscnetwork/go-vsc-node:main
    command: ./vsc-node --init
    environment:
      - MONGO_URL=mongodb://mongo:27017
    depends_on:
      - mongo
    networks:
      - dbnet
      - btcnet
    volumes:
      - ./data:/home/app/app/data
  go-vsc-node: # name of the service
    image: vscnetwork/go-vsc-node:main
    pull_policy: always
    container_name: go-vsc-node # what to label the container for docker ps
    restart: always # restart if failed, until we stop it ourselves
    depends_on:
      - mongo
      - btcd
    networks:
      - dbnet   # mongo (internal)
      - btcnet  # btcd + outbound (Hive L1 / peers)
    ports:
      - 8080:8080
      - 10720:10720
      - 10720:10720/udp
    environment:
      - MONGO_URL=mongodb://mongo:27017
    volumes:
      - ./data:/home/app/app/data
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "10m"
    labels:
      - "com.centurylinklabs.watchtower.enable=${AUTO_UPDATE:-true}"
    deploy:
      resources:
        limits:
          memory: 2048M
  mongo:
    container_name: mongo_vsc
    image: mongo:8.0.17
    pull_policy: always
    restart: always
    # review2 HIGH #10: the host publish (127.0.0.1:27021:27017) exposed an
    # unauthenticated MongoDB to every process / user on the host. The node
    # talks to mongo over the internal dbnet (mongo:27017), NOT this port, so
    # it is removed. For occasional admin access use:
    #   docker compose exec mongo mongosh
    # (Enabling MongoDB auth is the recommended further hardening — see
    # SECURITY.md for the migration steps; it is intentionally not forced
    # here because it locks out existing data dirs until a user is created.)
    networks:
      - dbnet
    volumes:
      - ./data/vsc-db:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      retries: 5
      timeout: 5s
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "5m"
    labels:
      - "com.centurylinklabs.watchtower.enable=${AUTO_UPDATE:-true}"
    deploy:
      resources:
        limits:
          memory: 1G

  # review2 HIGH #11: watchtower previously bind-mounted /var/run/docker.sock
  # read-write (full host control = container-escape vector). It now reaches a
  # least-privilege docker-socket-proxy over an internal network instead; only
  # the proxy touches the socket, and only the read endpoints + the POST verb
  # watchtower needs to recreate containers are allowed.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: vsc-docker-socket-proxy
    restart: always
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - POST=1   # required for watchtower to stop/recreate containers
      # everything else stays at the proxy's deny-by-default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxynet

  # Watchtower automatically updates the containers
  watchtower:
    # review2 #51: watchtower itself was unpinned (floating :latest) — the
    # one component that controls image updates must not silently update
    # itself. Pin it. (vscnetwork/go-vsc-node:main stays a mutable tag by
    # design — auto-deploying node releases is the intended ops workflow;
    # digest-pinning it is an ops-policy decision, see SECURITY.md #51.)
    image: containrrr/watchtower:1.7.1
    depends_on:
      - docker-socket-proxy
    command: --label-enable --interval 3600 --cleanup
    environment:
      - DOCKER_API_VERSION=1.44
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    networks:
      - proxynet
    restart: always

  btcd:
    image: bitcoin/bitcoin:29.3
    container_name: vsc-btcd
    # review2 HIGH #9/#56: RPC was open to 0.0.0.0/0 with hardcoded creds
    # passed on the command line (visible in `ps` / `docker inspect`). The
    # creds are now env-overridable (set unique values in .env and mirror
    # them in the node's BTC RPC config) and RPC is restricted to the pinned
    # btcnet subnet — only go-vsc-node sits there.
    command: >-
      -rpcuser=${BTC_RPC_USER:-vsc-node-user}
      -rpcpassword=${BTC_RPC_PASS:-vsc-node-pass}
      -rpcallowip=172.28.7.0/24
      -rpcbind=0.0.0.0
      -prune=550 -dbcache=2048 -server=1 -listen=1
    restart: always
    volumes:
      - ./.btc-data:/home/bitcoin/.bitcoin
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "10m"
    networks:
      - btcnet
networks:
  dbnet:
    driver: bridge
    internal: true
  btcnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.7.0/24
  proxynet:
    driver: bridge
    internal: true
